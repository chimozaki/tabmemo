<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0e7fa8"/>
      <stop offset="100%" stop-color="#09c4a0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f8f6"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".15"/>
    </filter>
    <filter id="dotshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#c06000" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- 背景（フル塗り） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- セーフゾーン内(51px〜461px)にデザインを収める -->

  <!-- カード：セーフゾーン内で中央配置 -->
  <rect x="110" y="128" width="268" height="252" rx="28" fill="url(#card)" filter="url(#shadow)"/>

  <!-- タブ -->
  <rect x="130" y="110" width="92"  height="40" rx="12 12 0 0" fill="#ffffff" opacity=".95"/>
  <rect x="234" y="118" width="76"  height="32" rx="10 10 0 0" fill="#ffffff" opacity=".5"/>

  <!-- テキスト行 -->
  <rect x="136" y="188" width="164" height="15" rx="7" fill="#0e9fa0"/>
  <rect x="136" y="220" width="196" height="12" rx="6" fill="#b2dfe0" opacity=".9"/>
  <rect x="136" y="248" width="148" height="12" rx="6" fill="#b2dfe0" opacity=".7"/>
  <rect x="136" y="280" width="196" height="1"  rx="1" fill="#c8eeed" opacity=".7"/>
  <rect x="136" y="296" width="112" height="12" rx="6" fill="#b2dfe0" opacity=".55"/>
  <rect x="136" y="320" width="80"  height="12" rx="6" fill="#b2dfe0" opacity=".4"/>

  <!-- ワンポイント丸（セーフゾーン内に収める：461-42=419以内） -->
  <circle cx="340" cy="332" r="44" fill="#fff" opacity=".2" filter="url(#dotshadow)"/>
  <circle cx="340" cy="332" r="36" fill="url(#dot)" filter="url(#dotshadow)"/>
  <circle cx="333" cy="325" r="12" fill="#ffffff" opacity=".35"/>
</svg>
