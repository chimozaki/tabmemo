<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0e7fa8"/>
      <stop offset="100%" stop-color="#09c4a0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f8f6"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <filter id="dotshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#c06000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- カード -->
  <rect x="86" y="100" width="310" height="290" rx="34" fill="url(#card)" filter="url(#shadow)"/>

  <!-- タブ -->
  <rect x="108" y="80"  width="104" height="46" rx="14 14 0 0" fill="#ffffff" opacity=".95"/>
  <rect x="228" y="90"  width="86"  height="36" rx="11 11 0 0" fill="#ffffff" opacity=".5"/>

  <!-- テキスト行 -->
  <rect x="120" y="168" width="190" height="17" rx="8"  fill="#0e9fa0"/>
  <rect x="120" y="206" width="228" height="13" rx="6"  fill="#b2dfe0" opacity=".9"/>
  <rect x="120" y="236" width="170" height="13" rx="6"  fill="#b2dfe0" opacity=".7"/>
  <rect x="120" y="274" width="228" height="1"  rx="1"  fill="#c8eeed" opacity=".7"/>
  <rect x="120" y="292" width="130" height="13" rx="6"  fill="#b2dfe0" opacity=".55"/>
  <rect x="120" y="318" width="95"  height="13" rx="6"  fill="#b2dfe0" opacity=".4"/>

  <!-- ワンポイント丸（中央寄り・オレンジ＆黄色で目立たせる） -->
  <circle cx="366" cy="346" r="52" fill="#fff" opacity=".25" filter="url(#dotshadow)"/>
  <circle cx="366" cy="346" r="42" fill="url(#dot)" filter="url(#dotshadow)"/>
  <circle cx="358" cy="338" r="14" fill="#ffffff" opacity=".35"/>
</svg>
